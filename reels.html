<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#050507">

    <title>IQRANIX Reels</title>

    <link rel="stylesheet" href="reels.css">
</head>

<body>

<main class="reels-page">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="reels-header">

        <button
            id="backBtn"
            class="header-btn"
            aria-label="Go back"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 12H5M11 6l-6 6 6 6"/>
            </svg>
        </button>


        <div class="brand">
            <span>IQRANIX</span>
            <strong>Reels</strong>
        </div>

    </header>


    <!-- =====================================================
         REELS FEED
    ====================================================== -->

    <section
        id="reelsFeed"
        class="reels-feed"
    >

        <div class="state">

            <div class="state-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="3"/>
                    <path d="M8 5l2-3h4l2 3"/>
                    <path d="M10 10l5 3-5 3z"/>
                </svg>
            </div>

            <h2>IQRANIX Reels</h2>

            <p>
                Sign in to view beneficial Reels.
            </p>

        </div>

    </section>

</main>


<script
    type="module"
    src="reels.js"
></script>

</body>
</html>
