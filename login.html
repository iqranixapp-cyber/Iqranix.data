<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B6E4F">

    <title>Sign In — Iqranix</title>

    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="brand">
                <img src="logo.png" alt="Iqranix logo" class="logo">

                <h1>Welcome to Iqranix</h1>

                <p>Your Complete Islamic Companion</p>
            </div>


            <!-- Google Sign In -->
            <button
                type="button"
                id="google-login"
                class="google-btn"
            >
                <span class="google-logo">G</span>
                <span>Continue with Google</span>
            </button>


            <div class="divider">
                <span>OR</span>
            </div>


            <!-- Email / Password -->
            <form id="login-form">

                <div class="input-group">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        autocomplete="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="input-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        minlength="6"
                        required
                    >
                </div>


                <button
                    type="submit"
                    id="login-btn"
                    class="primary-btn"
                >
                    Sign In
                </button>

            </form>


            <button
                type="button"
                id="signup-btn"
                class="signup-btn"
            >
                Create a new account
            </button>


            <button
                type="button"
                id="forgot-password"
                class="forgot-btn"
            >
                Forgot password?
            </button>


            <div
                id="message"
                class="message"
                role="status"
                aria-live="polite"
            ></div>


            <p class="terms-text">
                By continuing, you agree to use Iqranix responsibly.
            </p>

        </section>

    </main>


    <script
        type="module"
        src="login.js"
    ></script>

</body>
</html>
